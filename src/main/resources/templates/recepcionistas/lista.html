<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" th:href="@{/css/app.css}"><meta charset="UTF-8"><title>Recepcionistas</title></head>
<body class="with-shell">
<div class="mobile-overlay" id="mobile-overlay"></div><div class="app-layout">
<div th:replace="~{fragments/shell :: sidebar}"></div><div class="workspace">
<div th:replace="~{fragments/shell :: topbar}"></div>
<div class="page-content">
<h1>Recepcionistas</h1>
<p><a class="action-link" th:href="@{/recepcionistas/novo}">Cadastrar recepcionista</a> | <a th:href="@{/home}">Início</a></p>
<form th:action="@{/recepcionistas/pesquisar}" method="get">
    <label>Pesquisar por nome:</label><input type="text" name="nome" th:value="${nomePesquisa}">
    <button type="submit">Pesquisar</button> <a th:href="@{/recepcionistas}">Limpar</a>
</form><hr>
<p th:if="${#lists.isEmpty(recepcionistas)}">Nenhuma recepcionista cadastrada.</p>
<table border="1" cellpadding="6" th:if="${!#lists.isEmpty(recepcionistas)}">
<thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>CPF</th><th>Telefone</th><th>Data de admissão</th><th>Ações</th></tr></thead>
<tbody><tr th:each="r : ${recepcionistas}">
    <td th:text="${r.id}"></td><td th:text="${r.usuario.nome}"></td><td th:text="${r.usuario.email}"></td>
    <td th:text="${r.cpf}"></td><td th:text="${r.telefone}"></td><td th:text="${r.dataAdmissao}"></td>
    <td><a th:href="@{/recepcionistas/editar/{id}(id=${r.id})}">Editar</a>
        <form th:action="@{/recepcionistas/excluir/{id}(id=${r.id})}" method="post" style="display:inline">
            <button type="submit" onclick="return confirm('Deseja excluir esta recepcionista?')">Excluir</button>
        </form></td>
</tr></tbody>
</table>
</div><footer class="app-footer">OdontoCare <span>•</span> Sistema de gestão odontológica</footer></div></div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" th:href="@{/css/app.css}"><meta charset="UTF-8"><title>Administrador</title></head>
<body class="with-shell">
<div class="mobile-overlay" id="mobile-overlay"></div><div class="app-layout">
<div th:replace="~{fragments/shell :: sidebar}"></div><div class="workspace">
<div th:replace="~{fragments/shell :: topbar}"></div>
<div class="page-content">
<h1 th:text="${usuario.id == null ? 'Cadastrar administrador' : 'Editar administrador'}"></h1>
<p th:if="${mensagemErro}" th:text="${mensagemErro}"></p>
<form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post" class="record-form">
    <input type="hidden" th:field="*{id}">
    <input type="hidden" th:field="*{perfil}">
    <p><label>Nome:</label><br><input type="text" th:field="*{nome}" required></p>
    <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
    <p><label>E-mail:</label><br><input type="email" th:field="*{email}" required></p>
    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    <p><label>Senha:</label><br>
        <input type="password" th:field="*{senha}" th:required="${usuario.id == null}">
        <small th:if="${usuario.id != null}">Deixe em branco para manter a senha atual.</small>
    </p>
    <p><label><input type="checkbox" th:field="*{ativo}"> Ativo</label></p>
    <button type="submit">Salvar</button>
    <a th:href="@{/usuarios}">Cancelar</a>
</form>
</div><footer class="app-footer">OdontoCare <span>•</span> Sistema de gestão odontológica</footer></div></div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>

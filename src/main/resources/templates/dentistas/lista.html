<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" th:href="@{/css/app.css}"><meta charset="UTF-8"><title>Dentistas</title></head>
<body class="with-shell">
<div class="mobile-overlay" id="mobile-overlay"></div><div class="app-layout">
<div th:replace="~{fragments/shell :: sidebar}"></div><div class="workspace">
<div th:replace="~{fragments/shell :: topbar}"></div>
<div class="page-content">
<h1>Dentistas</h1>
<p><a class="action-link" th:href="@{/dentistas/novo}">Cadastrar dentista</a> | <a th:href="@{/home}">Início</a></p>
<p th:if="${mensagem}" th:text="${mensagem}"></p><p th:if="${mensagemErro}" th:text="${mensagemErro}"></p>
<form th:action="@{/dentistas/pesquisar}" method="get">
    <label>Pesquisar por nome:</label><input type="text" name="nome" th:value="${nomePesquisa}">
    <button type="submit">Pesquisar</button> <a th:href="@{/dentistas}">Limpar</a>
</form><hr>
<p th:if="${#lists.isEmpty(dentistas)}">Nenhum dentista cadastrado.</p>
<table border="1" cellpadding="6" th:if="${!#lists.isEmpty(dentistas)}">
<thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>CRO</th><th>Especialidade</th><th>Telefone</th><th>Ações</th></tr></thead>
<tbody><tr th:each="d : ${dentistas}">
    <td th:text="${d.id}"></td><td th:text="${d.usuario.nome}"></td><td th:text="${d.usuario.email}"></td>
    <td th:text="${d.cro}"></td><td th:text="${d.especialidade}"></td><td th:text="${d.telefone}"></td>
    <td><a th:href="@{/dentistas/editar/{id}(id=${d.id})}">Editar</a>
        <form th:action="@{/dentistas/excluir/{id}(id=${d.id})}" method="post" style="display:inline">
            <button type="submit" onclick="return confirm('Deseja excluir este dentista?')">Excluir</button>
        </form></td>
</tr></tbody>
</table>
</div><footer class="app-footer">OdontoCare <span>•</span> Sistema de gestão odontológica</footer></div></div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>

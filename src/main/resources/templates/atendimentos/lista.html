<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" th:href="@{/css/app.css}">
    <meta charset="UTF-8">
    <title>Meus Atendimentos</title>
</head>
<body class="with-shell">
<div class="mobile-overlay" id="mobile-overlay"></div><div class="app-layout">
<div th:replace="~{fragments/shell :: sidebar}"></div><div class="workspace">
<div th:replace="~{fragments/shell :: topbar}"></div>
<div class="page-content">
<h1>Meus Atendimentos</h1>
<p>
    <a th:href="@{/agenda}">Minha agenda</a> |
    <a th:href="@{/historico-pacientes}">Histórico clínico</a> |
    <a th:href="@{/home}">Início</a>
</p>

<form th:action="@{/atendimentos}" method="get">
    <label>Data inicial:</label>
    <input type="date" name="dataInicio" th:value="${dataInicio}">

    <label>Data final:</label>
    <input type="date" name="dataFim" th:value="${dataFim}">

    <button type="submit">Filtrar</button>
    <a th:href="@{/atendimentos}">Limpar filtro</a>
</form>

<p th:if="${mensagemErro}" th:text="${mensagemErro}"></p>

<p th:if="${#lists.isEmpty(atendimentos)}">Nenhum atendimento encontrado.</p>
<table border="1" cellpadding="6" th:if="${!#lists.isEmpty(atendimentos)}">
    <thead>
    <tr>
        <th>Data</th>
        <th>Horário</th>
        <th>Paciente</th>
        <th>Procedimento</th>
        <th>Prontuário</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${atendimentos}">
        <td th:text="${#temporals.format(c.dataHora, 'dd/MM/yyyy')}"></td>
        <td th:text="${#temporals.format(c.dataHora, 'HH:mm')}"></td>
        <td th:text="${c.paciente.usuario.nome}"></td>
        <td th:text="${c.procedimento != null ? c.procedimento.nome : '-'}"></td>
        <td>
            <a th:if="${prontuarioPorConsulta[c.id] != null}"
               th:href="@{/prontuarios/ver/{id}(id=${prontuarioPorConsulta[c.id].id})}">Ver prontuário</a>
            <span th:if="${prontuarioPorConsulta[c.id] == null}">-</span>
        </td>
        <td>
            <a th:href="@{/historico-pacientes/{id}(id=${c.paciente.id})}">Histórico do paciente</a>
        </td>
    </tr>
    </tbody>
</table>
</div><footer class="app-footer">OdontoCare <span>•</span> Sistema de gestão odontológica</footer></div></div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>

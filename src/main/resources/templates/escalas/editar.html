<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" th:href="@{/css/app.css}"><meta charset="UTF-8"><title>Editar Escala</title></head>
<body class="with-shell">
<div class="mobile-overlay" id="mobile-overlay"></div><div class="app-layout">
<div th:replace="~{fragments/shell :: sidebar}"></div><div class="workspace">
<div th:replace="~{fragments/shell :: topbar}"></div>
<div class="page-content">
<h1>Editar Escala do Dia</h1>
<p><strong>Dentista:</strong> <span th:text="${escala.dentista.usuario.nome}"></span></p>
<p><strong>Data:</strong> <span th:text="${#temporals.format(escala.data, 'dd/MM/yyyy')}"></span></p>
<p th:if="${mensagemErro}" th:text="${mensagemErro}"></p>

<form th:action="@{/escalas/salvar}" th:object="${escalaDia}" method="post" class="record-form">
    <input type="hidden" th:field="*{id}">
    <p><label>Início:</label><br><input type="time" th:field="*{horaInicio}" step="1800" required></p>
    <p><label>Fim:</label><br><input type="time" th:field="*{horaFim}" step="1800" required></p>
    <p><label>Início da pausa:</label><br><input type="time" th:field="*{pausaInicio}" step="1800"></p>
    <p><label>Fim da pausa:</label><br><input type="time" th:field="*{pausaFim}" step="1800"></p>
    <p><label>Status:</label><br>
        <select th:field="*{status}">
            <option th:each="s : ${statusEscala}" th:value="${s}" th:text="${s}"></option>
        </select>
    </p>
    <p><label>Observação:</label><br><textarea th:field="*{observacao}" rows="3" cols="50"></textarea></p>
    <button type="submit">Salvar alterações</button> <a th:href="@{/escalas}">Cancelar</a>
</form>
</div><footer class="app-footer">OdontoCare <span>•</span> Sistema de gestão odontológica</footer></div></div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>

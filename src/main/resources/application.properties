spring.application.name=clinica-odontologica

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica_odontologica
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false

# Servidor
server.port=8080

# Checkout Mercado Pago: use variáveis de ambiente, nunca salve chaves no código.
mp.access-token=${MP_ACCESS_TOKEN:}
mp.webhook-secret=${MP_WEBHOOK_SECRET:}
mp.public-url=${MP_PUBLIC_URL:}

# Sessão web
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
